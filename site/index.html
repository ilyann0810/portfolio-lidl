    <title>Ilyann Mouisset — Rendu Lidl France</title>
    <script>
      // SPA redirect decoder — pairs with public/404.html.
      // GitHub Pages serves 404.html for unknown paths; that page rewrites the URL into ?/<path>
      // and we restore the real path here via History API before React Router boots.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      }(window.location));
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
